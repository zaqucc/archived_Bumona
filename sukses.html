<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesanan Berhasil - Archived bumona</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col justify-between">

    <main class="max-w-xl mx-auto p-4 py-8 text-center flex flex-col items-center justify-center flex-1 w-full">
        <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mb-4 shadow-sm">
            <span class="material-icons-round text-[36px]">check_circle</span>
        </div>
        
        <h2 class="text-xl font-extrabold text-slate-900 tracking-tight leading-tight">Pesanan Berhasil Dicatat!</h2>
        <p class="text-xs text-slate-500 font-medium mt-1.5 px-4">Satu langkah lagi untuk mendapatkan produk digital Anda. Silakan teruskan invoice ini ke WhatsApp admin.</p>

        <div id="invoice-card" class="bg-white border border-gray-100 rounded-3xl p-5 text-left w-full mt-6 shadow-sm flex flex-col gap-3">
            <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                <div>
                    <span id="inv-id" class="text-xs font-black text-slate-900 block"></span>
                    <span id="inv-tgl" class="text-[10px] font-bold text-slate-400 block mt-0.5"></span>
                </div>
                <span class="bg-amber-100 text-amber-800 text-[9px] font-black px-2 py-0.5 rounded shadow-3xs uppercase">Menunggu Pembayaran</span>
            </div>
            
            <div id="inv-items" class="flex flex-col gap-2 py-1 text-xs font-semibold text-slate-600"></div>
            
            <div class="border-t border-slate-100 pt-3 flex justify-between items-center">
                <span class="text-xs font-bold text-slate-500">Total Tagihan</span>
                <span id="inv-total" class="text-base font-black text-slate-900"></span>
            </div>
        </div>

        <button onclick="kirimKeWa()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-extrabold py-3.5 rounded-2xl flex items-center justify-center gap-2 transition mt-6 shadow-md cursor-pointer text-sm">
            <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413z"/></svg> Konfirmasi Pembayaran via WA
        </button>
    </main>

    <footer class="p-4 text-center">
        <button onclick="window.location.href='index.html'" class="text-xs font-extrabold text-slate-400 hover:text-slate-600 transition">Kembali ke Beranda</button>
    </footer>

    <!-- SCRIPTS MODULAR -->
    <script src="assets/js/config.js"></script>
    <script src="assets/js/helper.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
