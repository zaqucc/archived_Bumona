<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - Archived bumona</title>

    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Icon Libraries -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen">

    <!-- ========== LOGIN MODAL ========== -->
    <div id="login-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/60 backdrop-blur-md">
        <div class="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl border border-slate-100 text-center">
            <div class="w-12 h-12 bg-orange-50 text-orange-600 rounded-2xl flex items-center justify-center mx-auto mb-3">
                <span class="material-icons-round text-2xl">admin_panel_settings</span>
            </div>
            <h3 class="text-base font-extrabold text-slate-900 tracking-tight">Autentikasi Admin</h3>
            <p class="text-[11px] font-medium text-slate-400 mt-0.5 mb-5">Masukkan password kode akses admin Bumona.</p>
            <input type="password" id="pass-admin" placeholder="Masukkan password admin..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm font-semibold text-slate-700 focus:outline-none focus:border-orange-500 focus:bg-white transition-all text-center tracking-widest mb-4">
            <button onclick="verifikasiLoginAdmin()" class="w-full bg-orange-600 hover:bg-orange-700 text-white font-bold text-sm py-3.5 rounded-xl transition-all cursor-pointer shadow-xs">
                Masuk ke Dashboard
            </button>
        </div>
    </div>

    <!-- ========== IMAGE PREVIEW MODAL ========== -->
    <div id="img-modal" onclick="tutupPratinjauGambar()" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 backdrop-blur-xs p-4 opacity-0 pointer-events-none transition-all duration-200">
        <div class="max-w-md w-full max-h-[80vh] rounded-2xl overflow-hidden shadow-2xl relative" onclick="event.stopPropagation()">
            <img id="img-target-preview" src="" alt="Bukti Transfer" class="w-full h-full object-contain bg-black">
            <button onclick="tutupPratinjauGambar()" class="absolute top-3 right-3 w-8 h-8 bg-slate-900/60 hover:bg-slate-900 text-white rounded-full flex items-center justify-center cursor-pointer backdrop-blur-xs">
                <span class="material-icons-round text-sm">close</span>
            </button>
        </div>
    </div>

    <!-- ========== DASHBOARD UTAMA ========== -->
    <div id="admin-dashboard-layout" class="hidden">
        <!-- Header -->
        <header class="bg-white/90 backdrop-blur-md px-4 py-3 border-b border-slate-100 sticky top-0 z-40 shadow-2xs">
            <div class="max-w-7xl mx-auto flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <div class="w-8 h-8 bg-gradient-to-br from-orange-500 to-amber-500 text-white rounded-xl flex items-center justify-center shadow-xs">
                        <span class="material-icons-round text-sm">dashboard</span>
                    </div>
                    <div>
                        <h1 class="text-sm font-extrabold text-slate-900 tracking-tight leading-none">Archived Bumona</h1>
                        <span class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Control Panel</span>
                    </div>
                </div>
                <button onclick="muatDataAdmin()" class="w-8 h-8 bg-slate-50 border border-slate-200 hover:border-slate-300 text-slate-600 rounded-xl flex items-center justify-center transition-all cursor-pointer">
                    <span class="material-icons-round text-sm">refresh</span>
                </button>
            </div>
        </header>

        <!-- Konten Utama -->
        <main class="max-w-7xl mx-auto px-4 mt-5 space-y-5 pb-20">
            <!-- Statistik -->
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-gradient-to-br from-orange-50 to-amber-50/60 border border-orange-100/80 rounded-2xl p-4 relative overflow-hidden shadow-3xs">
                    <span class="text-[9px] font-extrabold text-orange-700 tracking-wider uppercase block mb-0.5">Total Omzet Sukses</span>
                    <p id="stat-omzet" class="text-base font-black text-slate-900 tracking-tight">Rp 0</p>
                </div>
                <div class="bg-white border border-slate-100 rounded-2xl p-4 relative overflow-hidden shadow-3xs">
                    <span class="text-[9px] font-extrabold text-slate-400 tracking-wider uppercase block mb-0.5">Antrean Pending</span>
                    <p id="stat-pending" class="text-base font-black text-slate-800 tracking-tight">0 Order</p>
                </div>
            </div>

            <!-- Search -->
            <div class="relative">
                <span class="material-icons-round absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm">search</span>
                <input type="text" id="input-cari-admin" onkeyup="filterTabelOrderAdmin()" placeholder="Cari nama, id order, email, atau nomor WA..." class="w-full bg-white border border-slate-200 rounded-xl pl-9 pr-4 py-3 text-xs font-semibold text-slate-700 focus:outline-none focus:border-orange-500 transition-colors shadow-3xs">
            </div>

            <!-- Loading -->
            <div id="admin-loading" class="text-center py-16">
                <div class="w-7 h-7 border-3 border-orange-600 border-t-transparent rounded-full animate-spin mx-auto mb-2.5"></div>
                <p class="text-xs font-semibold text-slate-400">Menyinkronkan data...</p>
            </div>

            <!-- Kosong -->
            <div id="admin-order-kosong" class="text-center py-16 hidden">
                <span class="material-icons-round text-slate-300 text-5xl mb-2.5">layers_clear</span>
                <p class="text-slate-500 font-bold text-sm">Tidak Ada Transaksi</p>
                <p id="txt-empty-desc" class="text-[11px] text-slate-400 mt-0.5">Belum ada data pesanan masuk.</p>
            </div>

            <!-- Daftar Order -->
            <div id="kontainer-order-admin" class="space-y-4 hidden"></div>
        </main>
    </div>

    <!-- ========== SCRIPTS MODULAR ========== -->
    <script src="assets/js/config.js"></script>
    <script src="assets/js/helper.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/admin.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
